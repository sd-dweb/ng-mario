<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="64" height="64" shape-rendering="crispEdges">
  <!-- Retro NES Mario Face Pixel Art -->
  <!-- Red Cap -->
  <rect x="3" y="1" width="5" height="1" fill="#d82800"/>
  <rect x="2" y="2" width="9" height="1" fill="#d82800"/>
  
  <!-- Hair / Sideburns -->
  <rect x="2" y="3" width="3" height="1" fill="#885818"/>
  <rect x="1" y="4" width="1" height="3" fill="#885818"/>
  <rect x="2" y="5" width="1" height="1" fill="#885818"/>
  <rect x="3" y="4" width="1" height="1" fill="#885818"/>
  
  <!-- Face Skin -->
  <rect x="5" y="3" width="2" height="1" fill="#fc9838"/>
  <rect x="4" y="4" width="4" height="1" fill="#fc9838"/>
  <rect x="3" y="5" width="3" height="1" fill="#fc9838"/>
  <rect x="4" y="6" width="3" height="1" fill="#fc9838"/>
  <rect x="3" y="7" width="5" height="1" fill="#fc9838"/>
  
  <!-- Eye -->
  <rect x="7" y="3" width="1" height="2" fill="#000000"/>
  
  <!-- Moustache -->
  <rect x="6" y="5" width="4" height="1" fill="#000000"/>
  
  <!-- Red Shirt -->
  <rect x="2" y="8" width="7" height="3" fill="#d82800"/>
  <rect x="0" y="8" width="2" height="2" fill="#fc9838"/>
  <rect x="9" y="8" width="2" height="2" fill="#fc9838"/>
  
  <!-- Overalls -->
  <rect x="3" y="10" width="5" height="4" fill="#885818"/>
  <rect x="2" y="13" width="3" height="3" fill="#885818"/>
  <rect x="7" y="13" width="3" height="3" fill="#885818"/>
</svg>
